site_name: satprint
site_description: Satellite terrain to 3D-printable models -- watertight STL, multi-color 3MF and textured GLB, with OpenStreetMap buildings.
site_url: https://suchanek.github.io/satprint/
repo_url: https://github.com/suchanek/satprint
repo_name: suchanek/satprint
edit_uri: edit/main/docs/

theme:
  name: material
  logo: brand/satprint-mark.svg
  favicon: brand/satprint-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            heading_level: 2
            merge_init_into_class: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: install.md
      - The web app: usage.md
      - Print in several colors: multicolor.md
      - CLI reference: cli.md
      - REST API: rest-api.md
  - Data sources and limits: data-sources.md
  - Development: development.md
  - API reference:
      - Terrain and elevation: api/terrain.md
      - Meshes and file writers: api/mesh.md
      - Buildings: api/buildings.md
      - Bridges: api/bridges.md
      - Water and 3MF parts: api/water.md
      - Map services: api/osm.md
      - Presets: api/presets.md
      - Web app and API: api/app.md
      - Command line: api/cli.md
