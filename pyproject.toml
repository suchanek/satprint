[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satprint"
version = "0.1.0"
description = "Turn satellite elevation data into 3D-printable terrain models (STL), with a web front end."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "shapely>=2.1",
  "mapbox-vector-tile>=2.0",
]

[project.optional-dependencies]
geotiff = ["rasterio>=1.3"]
dev = ["pytest>=8", "httpx>=0.27", "ty>=0.0.41", "detect-secrets>=1.5.0"]

[project.scripts]
satprint = "satprint.cli:main"

[tool.setuptools.packages.find]
include = ["satprint*"]

[tool.setuptools.package-data]
satprint = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# KG index configuration. dockg and pycodekg are global tools, not
# dependencies: nothing under satprint/ imports them ("Tools are global",
# FLEET_STANDARDS).
# ---------------------------------------------------------------------------
[tool.pycodekg]
# Tests skew architectural metrics (fan-in, public API surface, docstring coverage).
exclude = ["tests"]
include = ["satprint"]

[tool.dockg]
exclude = ["__pycache__", "build", "dist", "satprint", "tests"]
