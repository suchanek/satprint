# pyproject.toml -- satprint package configuration
#
# Author: Eric G. Suchanek, PhD
#
# Quick install (poetry)
# ----------------------
#   poetry install                     core: the web app, CLI and REST API
#   poetry install --extras geotiff    + rasterio, to read GeoTIFF georeferencing
#   poetry install --extras overture   + overturemaps, the Overture building source
#   poetry install --with dev          + test, lint and type-check tooling
#   poetry install --with docs         + mkdocs, to build the Pages site
#   poetry install --all-extras --with dev,docs   everything
#
# Groups combine, and every group is optional -- a bare `poetry install` skips
# all of them.  No space after the comma: Poetry reads the name following it as
# a positional argument and refuses the command.
#
# Quick install (pip)
# -------------------
#   pip install -e .                   core
#   pip install -e ".[geotiff]"        + rasterio
#   pip install -e ".[overture]"       + overturemaps
#
# Dev and docs tooling live in optional Poetry groups, not extras, so they stay
# out of the published wheel metadata; there is no `.[dev]` to pip-install.
# (Fleet convention: extras are user-facing features, groups are repo tooling.)
#
# Run tests
# ---------
#   poetry install --with dev          prerequisite
#   pytest                             uses [tool.pytest.ini_options]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "satprint" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "satprint"
version = "0.4.0"
description = "Satellite terrain to 3D-printable models: watertight STL, multi-color 3MF and textured GLB, with OpenStreetMap buildings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }]
keywords = [
    "3d-printing",
    "terrain",
    "digital-elevation-model",
    "openstreetmap",
    "stl",
    "3mf",
    "gltf",
    "multi-material",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: GIS",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"

dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "shapely>=2.1",
    "mapbox-vector-tile>=2.0",
]

[project.optional-dependencies]
# GeoTIFF uploads are read as plain rasters without it; with it, their
# georeferencing sets the ground size.
geotiff = ["rasterio>=1.3"]
# Overture Maps as a building source: OSM merged with Microsoft and Google
# footprints. Brings pyarrow, about 190 MB.
overture = ["overturemaps>=1.0"]

[project.urls]
Homepage = "https://github.com/suchanek/satprint"
Repository = "https://github.com/suchanek/satprint"
Documentation = "https://suchanek.github.io/satprint/"
Issues = "https://github.com/suchanek/satprint/issues"

[project.scripts]
satprint = "satprint.cli:main"

# ---------------------------------------------------------------------------
# Dependency groups (poetry)
# ---------------------------------------------------------------------------
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
httpx = ">=0.27"  # fastapi's TestClient
ruff = ">=0.15"
ty = ">=0.0.41"
detect-secrets = ">=1.5.0"
pre-commit = ">=4.5.1"

[tool.poetry.group.docs]
optional = true

# The GitHub Pages site (docs.yml): mkdocs-material renders docs/*.md as-is,
# and mkdocstrings adds an API reference generated from the package's own
# docstrings so it cannot drift from the code.
[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.26", extras = ["python"] }

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]

# The rule set is listed rather than left to ruff's defaults, which widened in
# 0.16: CI installs the newest ruff and pre-commit pins an older one, and both
# must check the same rules. Same set as quiltwright; the line length stays at
# ruff's default 88, which the code is formatted to.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares request parameters through call defaults (File(...)).
"satprint/app.py" = ["B008"]
"tests/*" = ["B008"]

# ---------------------------------------------------------------------------
# KG index configuration. dockg and pycodekg are global tools, not
# dependencies: nothing under satprint/ imports them ("Tools are global",
# FLEET_STANDARDS).
# ---------------------------------------------------------------------------
[tool.pycodekg]
# Tests skew architectural metrics (fan-in, public API surface, docstring coverage).
exclude = ["tests"]
include = ["satprint"]

[tool.dockg]
# `site` is the mkdocs build output, gitignored; indexing it would count every
# page twice.
exclude = ["__pycache__", "build", "dist", "satprint", "site", "tests"]
