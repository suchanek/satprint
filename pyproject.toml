[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satprint"
version = "0.1.0"
description = "Turn satellite elevation data into 3D-printable terrain models (STL), with a web front end."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
geotiff = ["rasterio>=1.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
satprint = "satprint.cli:main"

[tool.setuptools.packages.find]
include = ["satprint*"]

[tool.setuptools.package-data]
satprint = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
